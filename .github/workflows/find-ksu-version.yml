name: Find SukiSU Commit by KSU_VERSION

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: '目标 KSU_VERSION，例如 40796'
        required: true
        default: '40796'
        type: string
      branch:
        description: '用于定位 commit 的 SukiSU 分支'
        required: true
        default: 'builtin'
        type: string

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6

      - name: Clone SukiSU-Ultra with full history
        run: |
          git clone --filter=blob:none https://github.com/SukiSU-Ultra/SukiSU-Ultra.git sukisu
          cd sukisu
          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Locate commit for target KSU_VERSION
        id: find
        shell: bash
        run: |
          set -euo pipefail
          cd sukisu

          TARGET='${{ inputs.target_version }}'
          BRANCH='${{ inputs.branch }}'
          VERSION_BRANCH='main'
          MAKEFILE='kernel/Makefile'

          git checkout -B "$BRANCH" "origin/$BRANCH"

          VERSION_BASE=$(sed -nE 's/^VERSION_BASE[[:space:]]*:=[[:space:]]*([0-9]+).*/\1/p' "$MAKEFILE" | head -n1)
          VERSION_OFFSET=$(sed -nE 's/^VERSION_OFFSET[[:space:]]*:=[[:space:]]*([0-9]+).*/\1/p' "$MAKEFILE" | head -n1)
          DECLARED_REPO_BRANCH=$(sed -nE 's/^REPO_BRANCH[[:space:]]*:=[[:space:]]*([^[:space:]]+).*/\1/p' "$MAKEFILE" | head -n1)
          [[ -n "$DECLARED_REPO_BRANCH" ]] && VERSION_BRANCH="$DECLARED_REPO_BRANCH"

          REQUIRED_COUNT=$(( TARGET - VERSION_BASE + VERSION_OFFSET ))

          echo "Target KSU_VERSION : $TARGET"
          echo "VERSION_BASE       : $VERSION_BASE"
          echo "VERSION_OFFSET     : $VERSION_OFFSET"
          echo "REPO_BRANCH        : $VERSION_BRANCH"
          echo "Required rev count : $REQUIRED_COUNT"

          TOTAL_MAIN=$(git rev-list --count "origin/$VERSION_BRANCH")
          TOTAL_TARGET=$(git rev-list --count "origin/$BRANCH")
          echo "Current $VERSION_BRANCH count: $TOTAL_MAIN"
          echo "Current $BRANCH count: $TOTAL_TARGET"

          if (( REQUIRED_COUNT > TOTAL_MAIN )); then
            echo "Target version is newer than current $VERSION_BRANCH history" >&2
            exit 1
          fi

          MAIN_COMMIT=$(git rev-list --reverse "origin/$VERSION_BRANCH" | sed -n "${REQUIRED_COUNT}p")
          MAIN_DATE=$(git show -s --format='%cI' "$MAIN_COMMIT")
          MAIN_TS=$(git show -s --format='%ct' "$MAIN_COMMIT")

          BUILTIN_COMMIT=$(git rev-list -1 --before="@$MAIN_TS" "origin/$BRANCH" || true)
          if [[ -z "$BUILTIN_COMMIT" ]]; then
            echo "Unable to find a $BRANCH commit near target version timestamp" >&2
            exit 1
          fi

          SHORT_SHA=$(git rev-parse --short=8 "$BUILTIN_COMMIT")
          COMMIT_DATE=$(git show -s --format='%cI' "$BUILTIN_COMMIT")
          SUBJECT=$(git show -s --format='%s' "$BUILTIN_COMMIT")
          VERSION_CHECK=$(( VERSION_BASE + REQUIRED_COUNT - VERSION_OFFSET ))

          echo
          echo '=== RESULT ==='
          echo "Main commit at target count : $MAIN_COMMIT"
          echo "Main commit date            : $MAIN_DATE"
          echo "Nearest $BRANCH commit       : $BUILTIN_COMMIT"
          echo "Short SHA                   : $SHORT_SHA"
          echo "Commit date                 : $COMMIT_DATE"
          echo "Subject                     : $SUBJECT"
          echo "Version check               : $VERSION_CHECK"
          echo
          echo 'NOTE: current SukiSU Makefile derives KSU_VERSION from current main commit count via GitHub API.'
          echo 'Pinning an old builtin commit alone may still report the current KSU_VERSION unless the version-count logic is also pinned/overridden.'

          {
            echo "main_commit=$MAIN_COMMIT"
            echo "commit=$BUILTIN_COMMIT"
            echo "short_sha=$SHORT_SHA"
            echo "commit_date=$COMMIT_DATE"
            echo "calculated_version=$VERSION_CHECK"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## SukiSU commit lookup result'
            echo
            echo '| Field | Value |'
            echo '|---|---|'
            echo "| Target KSU_VERSION | \`$TARGET\` |"
            echo "| Makefile REPO_BRANCH | \`$VERSION_BRANCH\` |"
            echo "| Required main revision count | \`$REQUIRED_COUNT\` |"
            echo "| Main commit at that count | \`$MAIN_COMMIT\` |"
            echo "| Nearest $BRANCH commit | \`$BUILTIN_COMMIT\` |"
            echo "| Short SHA | \`$SHORT_SHA\` |"
            echo "| Commit date | \`$COMMIT_DATE\` |"
            echo "| Version check | \`$VERSION_CHECK\` |"
            echo
            echo "**Subject:** $SUBJECT"
          } >> "$GITHUB_STEP_SUMMARY"
